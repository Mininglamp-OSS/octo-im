name: Docker Publish
run-name: Publish v2.2.5-20261029 from 8fc476c5

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-octo-im-v2.2.5-20261029
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and verify dated image tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify source, publish tag, and read back manifest
        env:
          IMAGE: ghcr.io/mininglamp-oss/octo-im
          VERSION: v2.2.5-20261029
          REVISION: 8fc476c5373d79e18594b15b2313f2879cc3a8e4
          DIGEST: sha256:3f38219bcead0be7bdc685685d5b2a9713d53f58def51190678321afd1592eb4
        run: |
          set -euo pipefail
          source="${IMAGE}@${DIGEST}"
          target="${IMAGE}:${VERSION}"
          docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' > source-manifest.json
          jq -e --arg digest "$DIGEST" '.digest == $digest and ([.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"])' source-manifest.json
          while IFS=$'\t' read -r arch child_digest; do
            docker buildx imagetools inspect "${IMAGE}@${child_digest}" --format '{{json .Image}}' > "config-${arch}.json"
            jq -e --arg revision "$REVISION" --arg arch "$arch" '.architecture == $arch and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $revision and .config.Labels["org.opencontainers.image.source"] == "https://github.com/Mininglamp-OSS/octo-im"' "config-${arch}.json"
          done < <(jq -r '.manifests[] | [.platform.architecture, .digest] | @tsv' source-manifest.json)
          if docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' > target-before.json 2> target-before.err; then
            jq -e --arg digest "$DIGEST" '.digest == $digest' target-before.json
          else
            if ! grep -Eiq 'not found|manifest unknown|MANIFEST_UNKNOWN' target-before.err; then
              cat target-before.err >&2
              exit 1
            fi
            docker buildx imagetools create --tag "$target" "$source"
          fi
          docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' > published-manifest.json
          jq -e --arg digest "$DIGEST" '.digest == $digest and ([.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"])' published-manifest.json
          jq -n --arg image "$target" --arg digest "$DIGEST" --arg revision "$REVISION" --arg build_run "https://github.com/Mininglamp-OSS/octo-im/actions/runs/40852200243" '{image: $image, digest: $digest, source_revision: $revision, build_run: $build_run}' > publication.json
          cat publication.json
          {
            echo "Image: $target"
            echo "Digest: $DIGEST"
            echo "Source: $REVISION"
            echo "Platforms: linux/amd64, linux/arm64"
            echo "Build: https://github.com/Mininglamp-OSS/octo-im/actions/runs/40852200243"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-v2.2.5-20261029-publication
          path: |
            source-manifest.json
            published-manifest.json
            config-*.json
            publication.json
          if-no-files-found: error
          retention-days: 30
